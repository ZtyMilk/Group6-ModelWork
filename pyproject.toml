[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZtyMilk", email = "ztymilk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "llamafactory[torch,metrics]",
    "bitsandbytes",
    "modelscope",
    "accelerate",
    "edge-tts>=7.3.1",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]
torchaudio = [
  {index = "pytorch-cu124"}
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
