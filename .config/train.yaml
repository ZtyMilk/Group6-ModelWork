model_name_or_path: .model/models/Qwen--Qwen2.5-1.5B-Instruct/snapshots/master
template: qwen
dataset_dir: .data
dataset: persona_toy
cutoff_len: 1024

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1

# 训练策略与超参数
output_dir: saves/persona_lora
overwrite_output_dir: true
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
logging_steps: 5
save_steps: 100
plot_loss: true